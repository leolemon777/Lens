name: 功能建议
description: 描述真实工作流中的问题和可验收的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述工作流和痛点，而不是只给出界面方案。
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 典型操作流
      placeholder: 当我……时，我希望……，以便……
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 可验收的结果
      description: 说明完成后如何判定这项功能真正有用。
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私、性能与平台影响
      description: 是否需要新权限、网络、模型、长时处理或 Windows 平台适配？
  - type: textarea
    id: references
    attributes:
      label: 参考产品或证据（可选）
      description: 可提供公开链接，但请不要附带个人媒体或敏感项目。
