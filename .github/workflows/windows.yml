name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'Desktop/**'
      - 'CoreRust/**'
      - 'Scripts/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'Desktop/**'
      - 'CoreRust/**'
      - 'Scripts/windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Rust tests
        working-directory: CoreRust
        run: cargo test --workspace --locked

      - name: Desktop typecheck and frontend build
        working-directory: Desktop
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

      - name: Tauri host check
        working-directory: Desktop/src-tauri
        run: cargo check --locked
