[workspace]
resolver = "2"
members = [
    "crates/lens-core",
    "crates/lens-project",
    "crates/lens-platform-windows",
    "crates/lens-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
