[package]
name = "lens-desktop-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Proprietary"

[lib]
name = "lens_desktop_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
lens-core = { path = "../../CoreRust/crates/lens-core" }
lens-platform-windows = { path = "../../CoreRust/crates/lens-platform-windows" }
lens-project = { path = "../../CoreRust/crates/lens-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.3.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
