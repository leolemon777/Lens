[package]
name = "lens-windows"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lens Windows recording workbench — Rust / Tauri 2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lens-core = { path = "../crates/lens-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "6"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
wasapi = "=0.24.0"
windows = { version = "=0.62.2", features = [
 "Win32_Foundation", "Win32_System_Performance", "Win32_System_Com",
 "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
 "Win32_Graphics_Gdi", "Win32_System_Threading"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
